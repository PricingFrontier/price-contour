[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "price-contour"
version = "0.4.1"
description = "High-performance insurance price optimisation via Lagrangian dual decomposition"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20",
    "pyarrow>=23.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "maturin>=1.4",
    "hypothesis>=6.0",
    "pre-commit>=4.0",
]
test = [
    "scipy>=1.10",
]

[tool.maturin]
manifest-path = "crates/price-contour/Cargo.toml"
python-source = "python"
module-name = "price_contour._price_contour"
# abi3-py310 produces a single Python-version-agnostic wheel (3.10+).
# One compile, one link step, one wheel per OS instead of four. The ~1-3%
# stable-ABI overhead lives at the Python↔Rust call boundary, which we
# cross once per solve()/apply() — the Lagrangian inner loop is pure
# Rust, so the runtime impact is invisible for our workloads.
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
include = ["LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["tests/python"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "ipykernel>=7.2.0",
    "maturin>=1.12.4",
    "nbclient>=0.10.4",
    "pytest>=9.0.2",
]
test = [
    "scipy>=1.10",
]

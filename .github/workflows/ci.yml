name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # publish.yml calls this workflow and publishes only if it passes.
  workflow_call:

concurrency:
  # github.workflow is the caller's name under workflow_call, so the copy
  # publish.yml runs does not cancel (or get cancelled by) the push run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=x86-64-v3"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: astral-sh/setup-uv@v6

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Ruff check
        # Same ruff as .pre-commit-config.yaml; an unpinned uvx picks up new
        # default rules on every ruff release.
        run: uvx ruff@0.9.10 check python/ tests/

      - name: Ruff format
        run: uvx ruff@0.9.10 format --check python/ tests/

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run tests
        run: cargo test --workspace

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: py-${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      # Everything comes from uv.lock, so the suite runs on the Polars the
      # lock pins. --no-sync keeps later steps from re-resolving it.
      - name: Install dependencies from the lock
        run: uv sync --locked --python ${{ matrix.python-version }} --no-install-project --group test

      - name: Build the extension
        run: |
          uv run --no-sync python -c "import polars; print('polars', polars.__version__)"
          uv run --no-sync maturin develop --release

      - name: Run tests
        run: uv run --no-sync pytest tests/python -v --tb=short

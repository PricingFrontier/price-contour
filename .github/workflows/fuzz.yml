name: Fuzz Testing

on:
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday 03:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_validate_and_solve
          - fuzz_argmax_pass
          - fuzz_solve_grouped
          - fuzz_baseline_totals
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/price-contour-core/fuzz -> target"
          key: fuzz-${{ matrix.target }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzzer (5 minutes)
        run: |
          cd crates/price-contour-core
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=300
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.target }}
          path: crates/price-contour-core/fuzz/corpus/${{ matrix.target }}/
          retention-days: 30

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-${{ matrix.target }}
          path: crates/price-contour-core/fuzz/artifacts/${{ matrix.target }}/
          retention-days: 90

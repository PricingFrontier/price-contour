name: Publish to PyPI

on:
  push:
    branches: [main]

jobs:
  check-version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for version bump
        id: check
        run: |
          NEW_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          OLD_VERSION=$(git show HEAD~1:pyproject.toml | python3 -c "
          import sys, tomllib
          print(tomllib.load(sys.stdin.buffer)['project']['version'])
          " 2>/dev/null || echo "0.0.0")

          echo "old=$OLD_VERSION new=$NEW_VERSION"
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-wheels:
    name: Build wheels (${{ matrix.target }})
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel sibling jobs on first failure — keep good wheels from
      # the OSes that finished while we debug the one that didn't.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # Ensure a 3.10 interpreter is available — abi3-py310 produces ONE
      # wheel that works for 3.10..3.13 simultaneously, but maturin still
      # needs a host interpreter to build against. Pinning 3.10 also makes
      # the rust-cache key stable across runner Python upgrades.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Cache `~/.cargo/registry` and the `target/` dir keyed on
      # Cargo.lock + the matrix target. Cold first run after a lock change
      # is unchanged; subsequent runs drop polars compilation entirely.
      # Note: this runs natively on macOS/Windows. On the manylinux Linux
      # build it has limited effect because maturin-action runs `cargo`
      # inside a Docker container that doesn't see the runner's filesystem.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # No `--interpreter` flag: maturin detects abi3 via the
          # pyo3/abi3-py310 feature in pyproject.toml and produces a
          # single wheel that works for Python 3.10+. `--strip` is a
          # no-op on Windows (debug info lives in separate `.pdb` files)
          # and adds time on macOS/Linux for negligible size savings;
          # leaving it off keeps the wheel slightly larger but speeds
          # the build.
          args: --release --out dist
          sccache: "true"
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          retention-days: 5

  build-sdist:
    name: Build sdist
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 5

  publish:
    name: Publish to PyPI
    needs: [check-version, build-wheels, build-sdist]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment:
      name: pypi
      url: https://pypi.org/project/price-contour/
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: false
          verbose: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: v${{ needs.check-version.outputs.new_version }}
          generate_release_notes: true
          files: dist/*
